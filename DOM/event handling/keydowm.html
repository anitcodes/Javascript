<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keydown</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      .container {
        width: 100%;
        height: 100%;
        background-color: #222;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #text {
        color: #eee;
        font-family:
          "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
        font-size: 8rem;
        font-weight: 400;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1 id="text"></h1>
    </div>

    <script>
      let text = document.querySelector("#text");
      window.addEventListener("keydown", function (dets) {
        if (dets.key === " ") {
          text.textContent = "SPACE";
        } else {
          text.textContent = dets.key;
        }
      });
    </script>
  </body>
</html>
